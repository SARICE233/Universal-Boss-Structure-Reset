# Gradle runtime
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# ForgeGradle 6 / Forge 1.20.1 breaks when a reused Gradle daemon is involved
# ('Project services has been closed'), so the daemon stays disabled in this workspace.
org.gradle.daemon=false

# The Forge maven is periodically slow from some networks; keep the build from
# failing on a single socket read timeout while resolving the ForgeGradle classpath.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=500

# Mod metadata (consumed by build.gradle and resources)
mod_id=structurereset
mod_name=Universal-Boss-Structure-Reset Mod
mod_version=0.1.0-alpha
mod_group_id=com.structurereset

# Minecraft / Forge
minecraft_version=1.20.1
forge_version=47.3.22
kubejs_version=2001.6.5-build.26
